# QuantFlow Platform — FastAPI backend + PyTorch ML engine + Rust core + Expo frontend
# docker compose up -d

services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ./frontend-expo/dist:/usr/share/nginx/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend]
    restart: unless-stopped

  backend:
    build: { context: ".", dockerfile: "docker/backend/Dockerfile" }
    ports: ["3000:3000"]
    environment:
      - DATABASE_URL=postgresql://quantflow:quantflow@postgres:5432/quantflow
      - REDIS_URL=redis://redis:6379
      - ML_ENGINE_URL=http://ml-engine:8000
      - JWT_SECRET=${JWT_SECRET:-dev-secret}
      - PAPER_TRADING=${PAPER_TRADING:-false}
      - STRIPE_SECRET=${STRIPE_SECRET:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    volumes: ["./checkpoints:/app/checkpoints:ro", "./data:/app/data:ro"]
    depends_on: [postgres, redis, ml-engine]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  ml-engine:
    build: { context: ".", dockerfile: "docker/ml/Dockerfile" }
    ports: ["8000:8000"]
    environment:
      - MODEL_PATH=/app/checkpoints/cascade_anp.pt
      - CACHE_DIR=/app/data/cache
      - OMP_NUM_THREADS=4
    volumes: ["./checkpoints:/app/checkpoints:ro", "./data:/app/data", "ml_cache:/app/data/cache"]
    deploy: { resources: { limits: { memory: "4G" }, reservations: { memory: "512M" } } }
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  rust-engine:
    build: { context: "engine-rust", dockerfile: "Dockerfile" }
    ports: ["50051:50051"]
    profiles: ["full"]
    depends_on: [ml-engine]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: "quantflow", POSTGRES_PASSWORD: "quantflow", POSTGRES_DB: "quantflow" }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  ml_cache:
