[package]
name = "quantflow-engine"
version = "0.1.0"
edition = "2021"
description = "QuantFlow Core Engine — order matching, market data ingestion, risk checks"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
thiserror = "2"
