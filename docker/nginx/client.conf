server {
    listen 80;
    server_name _;

    gzip on;
    gzip_types text/plain application/json text/css application/javascript;

    root /usr/share/nginx/html;
    index index.html;

    # SPA — all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to server (change SERVER_HOST to your server IP)
    location /api/ {
        proxy_pass http://${SERVER_HOST:-localhost}:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ML engine proxy
    location /ml/ {
        proxy_pass http://${SERVER_HOST:-localhost}:8000/;
        proxy_set_header Host $host;
    }

    # Health
    location /health {
        proxy_pass http://${SERVER_HOST:-localhost}:3000/health;
    }
}
