{% extends "base.html" %}
{% block title %}Settings — {{ app_name }}{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold text-white mb-6">Settings</h1>

<div class="grid md:grid-cols-4 gap-6">
    <div class="md:col-span-1 space-y-2">
        <a href="/settings" class="block p-3 rounded-lg bg-gray-800 text-white text-sm">Profile</a>
        <a href="/settings/billing" class="block p-3 rounded-lg bg-gray-900 text-gray-400 text-sm hover:text-white hover:bg-gray-800 transition-colors">Billing</a>
    </div>
    <div class="md:col-span-3">
        <div class="card">
            <h3 class="text-lg font-semibold text-white mb-4">Profile</h3>
            <form class="space-y-4 max-w-md">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Email</label>
                    <input class="input-field" value="{{ current_user.email }}" readonly>
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Display Name</label>
                    <input class="input-field" value="{{ current_user.display_name or '' }}">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Plan</label>
                    <div class="flex items-center gap-3">
                        <span class="text-white font-semibold">{{ current_user.tier_config.name }}</span>
                        {% if current_user.subscription_tier == 'free' %}
                        <a href="/pricing" class="text-teal-500 text-sm hover:underline">Upgrade</a>
                        {% endif %}
                    </div>
                </div>
                <button type="submit" class="btn-primary">Save Changes</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
