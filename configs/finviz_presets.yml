# Finviz screener presets configuration
# Use human-readable filters/values expected by current finvizfinance versions.

weekly_momo:
  Average Volume: Over 300K
  Option/Short: Optionable
  Performance: Week Up
  50-Day Simple Moving Average: Price above SMA50
  200-Day Simple Moving Average: Price above SMA200
  Price: Over $5

weekly_bear:
  Average Volume: Over 300K
  Option/Short: Optionable
  Performance: Week Down
  50-Day Simple Moving Average: Price below SMA50
  Price: Over $5

monthly_swing:
  Average Volume: Over 500K
  Option/Short: Optionable
  Performance: Month Up
  50-Day Simple Moving Average: Price above SMA50
  200-Day Simple Moving Average: Price above SMA200
  Beta: Over 1
  Price: Over $5

monthly_bear:
  Average Volume: Over 500K
  Option/Short: Optionable
  Performance: Month Down
  50-Day Simple Moving Average: Price below SMA50
  Beta: Over 1
  Price: Over $5

midterm_trenders:
  Average Volume: Over 500K
  Option/Short: Optionable
  Performance: Half Up
  200-Day Simple Moving Average: Price above SMA200
  Beta: Over 1
  Price: Over $5

midterm_bear:
  Average Volume: Over 500K
  Option/Short: Optionable
  Performance: Half Down
  200-Day Simple Moving Average: Price below SMA200
  Beta: Over 1
  Price: Over $5

reversal_bull:
  Average Volume: Over 300K
  Option/Short: Optionable
  RSI (14): Oversold (40)
  50-Day Simple Moving Average: Price below SMA50
  Price: Over $5

reversal_bear:
  Average Volume: Over 300K
  Option/Short: Optionable
  RSI (14): Overbought (60)
  50-Day Simple Moving Average: Price above SMA50
  Price: Over $5

leaps_quality:
  Average Volume: Over 1M
  Option/Short: Optionable
  Price: Over $10
  EPS growthqtr over qtr: Positive (>0%)
  Sales growthqtr over qtr: Positive (>0%)
  200-Day Simple Moving Average: Price above SMA200
